[project]
name = "lumi-sidecar"
version = "0.1.0"
description = "Lumi sidecar: speech recognition, speech synthesis, OCR and UI Automation for the desktop assistant"
readme = "README.md"
requires-python = ">=3.11,<3.13"
# The base install is the "leggero" profile: everything runs on the CPU and
# nothing needs CUDA (Kokoro voice, Whisper/Parakeet on CPU, OCR, UIA).
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "numpy>=2.0.2",
  "soundfile>=0.12",
  "soxr>=0.5",
  "num2words>=0.5.14",
  "huggingface-hub>=1.5,<2",
  "pillow>=10",
  "onnxruntime>=1.20.1",
  "faster-whisper>=1.2",
  "onnx-asr[hub]>=0.10",
  "kokoro-onnx>=0.5",
  "rapidocr>=3.0",
  "winocr>=0.0.15; sys_platform == 'win32'",
  "uiautomation>=2.0.20; sys_platform == 'win32'",
]

[project.optional-dependencies]
# "bilanciato" and "locale" profiles: Qwen3-TTS on the GPU (CUDA graphs,
# real streaming). torch also provides the CUDA 12 libraries faster-whisper
# needs to run on the GPU.
gpu = [
  "faster-qwen3-tts>=0.5.4",
  "torch==2.11.0",
  "torchaudio==2.11.0",
]
# Chatterbox Multilingual (zero-shot voice cloning). Its pins are older
# than Qwen3-TTS's: the overrides below let both live in one environment.
chatterbox = ["chatterbox-tts>=0.1.7", "faster-qwen3-tts>=0.5.4", "torch==2.11.0", "torchaudio==2.11.0"]
# whisper.cpp for PCs without a GPU
whispercpp = ["pywhispercpp>=1.5"]
# openWakeWord, for the "lumi" wake word model (otherwise the wake word is
# spotted in the transcripts). Training it (wake/train.py) also needs the
# gpu extra (torch) and a TTS engine; onnxscript is torch.onnx.export's
# exporter since torch 2.9.
wakeword = ["openwakeword>=0.6", "onnxscript>=0.5"]
# LoRA on Qwen3-TTS Base with one Italian reader (lora/, roadmap 17.5):
# training only, the merged model needs just the gpu extra
lora = ["peft>=0.17", "faster-qwen3-tts>=0.5.4", "torch==2.11.0", "torchaudio==2.11.0"]

[dependency-groups]
dev = ["pytest>=8", "pytest-timeout>=2.3", "httpx>=0.27"]

[tool.uv]
package = false
override-dependencies = [
  # Chatterbox pins torch 2.6, transformers 5.2, numpy<2 and diffusers 0.29:
  # it runs with the versions Qwen3-TTS needs
  "torch==2.11.0",
  "torchaudio==2.11.0",
  "transformers>=5.15.1,<6",
  "numpy>=2.0.2",
  "diffusers>=0.35",
  "safetensors>=0.5.3",
  "librosa>=0.11",
  # Gradio is only used by the demo UIs of qwen-tts and chatterbox
  "gradio; sys_platform == 'never'",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["model: needs real models (downloads, GPU); run with `pytest -m model`"]
addopts = "-m 'not model'"
timeout = 120
