<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0e0e14" />
    <title>Lumi</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Pairing: scan the QR code shown in the PC's settings, or paste its link -->
    <section id="setup" class="screen" hidden>
      <header class="brand">
        <svg class="mark" viewBox="0 0 48 48" aria-hidden="true"><rect x="13" y="8" width="8" height="32" rx="4" /><rect x="27" y="8" width="8" height="32" rx="4" /></svg>
        <h1>Lumi</h1>
      </header>
      <div class="intro">
        <p class="lead">Abbina il telefono al PC.</p>
        <p class="hint">Su Lumi apri <b>Impostazioni → Telefono</b> e tocca «Mostra il codice per abbinare».</p>
      </div>
      <button id="scan" class="btn primary" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2M7 12h10" /></svg>
        Inquadra il codice
      </button>
      <div id="scanner" class="scanner" hidden>
        <video id="camera" playsinline muted></video>
        <div class="frame" aria-hidden="true"></div>
        <button id="scanCancel" class="btn ghost" type="button">Annulla</button>
      </div>
      <details class="card">
        <summary>Oppure incolla il link</summary>
        <textarea id="pasteLink" rows="3" placeholder="lumi://pair?..."></textarea>
        <button id="pasteGo" class="btn ghost" type="button">Abbina</button>
      </details>
      <p id="setupStatus" class="status"></p>
    </section>

    <!-- Paired: call Lumi -->
    <section id="home" class="screen" hidden>
      <header class="top">
        <div class="brand small">
          <svg class="mark" viewBox="0 0 48 48" aria-hidden="true"><rect x="13" y="8" width="8" height="32" rx="4" /><rect x="27" y="8" width="8" height="32" rx="4" /></svg>
          <span>Lumi</span>
        </div>
        <div id="pcStatus" class="pill checking"><i class="dot"></i><span id="pcStatusText">Controllo…</span></div>
      </header>

      <main class="center">
        <p id="homeStatus" class="paired"></p>
        <div class="orb">
          <span class="ring" aria-hidden="true"></span>
          <button id="call" class="call" type="button" aria-label="Chiama Lumi">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z" /></svg>
            <span>Chiama</span>
          </button>
        </div>
        <p id="lastCall" class="last"></p>
        <p id="callStatus" class="status"></p>
      </main>

      <details class="card more">
        <summary>Impostazioni del telefono</summary>
        <label class="field"><span>Indirizzo del PC (per esempio quello di Tailscale)</span><input id="hostEdit" type="text" autocapitalize="off" /></label>
        <button id="hostSave" class="btn ghost" type="button">Salva l'indirizzo</button>
        <button id="unpair" class="btn danger" type="button">Dimentica questo PC</button>
      </details>
    </section>

    <!-- The call: Lumi's face lives here -->
    <section id="callScreen" class="screen call-screen" hidden>
      <header class="call-top">
        <div id="callPill" class="pill live"><i class="dot"></i><span id="timer">00:00</span></div>
      </header>
      <div id="stage"><canvas id="face"></canvas></div>
      <p id="subtitle" class="subtitle"></p>
      <nav class="controls">
        <button id="mute" class="round" type="button" aria-label="Silenzia">
          <svg class="icon-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z" /><path d="M19 11a7 7 0 0 1-14 0M12 18v4" /></svg>
          <svg class="icon-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 2l20 20M9 9v2a3 3 0 0 0 5.1 2.1M15 9.3V5a3 3 0 0 0-5.7-1.3M19 11a7 7 0 0 1-.9 3.4M5 11a7 7 0 0 0 11.3 5.5M12 18v4" /></svg>
        </button>
        <button id="ptt" class="talk" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z" /><path d="M19 11a7 7 0 0 1-14 0M12 18v4" /></svg>
          <span>Tieni premuto per parlare</span>
        </button>
        <button id="hangup" class="round hangup" type="button" aria-label="Riaggancia">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 13.2c0-1.2.4-2.3 1.3-3.1C7.1 6.9 9.4 6 12 6s4.9.9 8.2 4.1c.9.8 1.3 1.9 1.3 3.1 0 .9-.7 1.7-1.6 1.7h-2.5c-.9 0-1.6-.6-1.7-1.5l-.2-1.3c-.1-.6-.6-1-1.2-1.1-.9-.1-1.6-.2-2.6-.2s-1.7.1-2.6.2c-.6.1-1.1.5-1.2 1.1l-.2 1.3c-.1.9-.8 1.5-1.7 1.5H4.1c-.9 0-1.6-.8-1.6-1.7z" /></svg>
        </button>
      </nav>
    </section>

    <audio id="voice" autoplay playsinline></audio>
    <script src="app.js"></script>
  </body>
</html>
