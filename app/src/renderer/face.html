<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob:; connect-src 'self' blob: data:; worker-src 'self' blob:"
    />
    <title>Lumi</title>
    <link rel="stylesheet" href="face.css" />
  </head>
  <body>
    <canvas id="face" class="face"></canvas>
    <div id="bubble" class="bubble" hidden>
      <button id="bubble-close" class="bubble-close" type="button" title="Chiudi" aria-label="Chiudi">×</button>
      <div id="bubble-text" class="bubble-text"></div>
      <div id="bubble-choices" class="bubble-choices" hidden></div>
    </div>
    <form id="chat" class="chat" hidden>
      <textarea id="chat-input" rows="1" maxlength="4000" placeholder="Scrivi a Lumi…" aria-label="Messaggio"></textarea>
      <button id="chat-send" type="submit" title="Invia (Invio)" aria-label="Invia">➤</button>
    </form>
    <script src="main.js"></script>
  </body>
</html>
